<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#1a1a2e" />
<title>日语高频词 · 四选一</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --text: #f2f4f8;
    --muted: #9aa3b5;
    --accent: #5b8cff;
    --ok: #3ecf8e;
    --bad: #ff6b6b;
    --border: #2a2f3d;
    --btn: #252a38;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Noto Sans SC", "Noto Sans JP", sans-serif;
    min-height: 100%;
  }
  body { padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.15rem; font-weight: 700; margin: 4px 0 2px; letter-spacing: 0.02em; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .bar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 14px; font-size: 0.9rem; color: var(--muted);
  }
  .bar strong { color: var(--text); }
  .progress {
    height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 18px;
  }
  .progress > i {
    display: block; height: 100%; width: 0%; background: var(--accent);
    border-radius: 99px; transition: width 0.25s ease;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 22px 18px; text-align: center; margin-bottom: 16px;
  }
  .kanji { font-size: 2.4rem; font-weight: 700; line-height: 1.2; word-break: break-word; }
  .kana { font-size: 1.15rem; color: var(--muted); margin-top: 8px; }
  .romaji { font-size: 0.9rem; color: #6b7385; margin-top: 4px; letter-spacing: 0.04em; }
  .example { margin-top: 14px; font-size: 0.9rem; color: var(--muted); display: none; }
  .example.show { display: block; }
  .choices { display: grid; gap: 10px; }
  .choice {
    appearance: none; border: 1.5px solid var(--border); background: var(--btn);
    color: var(--text); border-radius: 14px; padding: 16px 14px;
    font-size: 1.05rem; text-align: left; cursor: pointer;
    min-height: 52px; transition: border-color 0.15s, background 0.15s, transform 0.05s;
  }
  .choice:active:not(:disabled) { transform: scale(0.98); }
  .choice:disabled { opacity: 0.95; cursor: default; }
  .choice.correct { border-color: var(--ok); background: rgba(62,207,142,0.15); }
  .choice.wrong { border-color: var(--bad); background: rgba(255,107,107,0.12); }
  .feedback {
    min-height: 1.4em; text-align: center; margin: 12px 0 8px;
    font-size: 0.95rem; color: var(--muted);
  }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .btn {
    flex: 1; appearance: none; border: none; border-radius: 14px;
    padding: 16px; font-size: 1.05rem; font-weight: 600; cursor: pointer;
    min-height: 52px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: 0.4; cursor: default; }
  .btn-ghost { background: var(--btn); color: var(--text); border: 1px solid var(--border); }
  .screen { display: none; }
  .screen.active { display: block; }
  .start-card, .result-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 28px 20px; text-align: center;
  }
  .start-card p, .result-card p { color: var(--muted); line-height: 1.55; }
  .score-big { font-size: 2.6rem; font-weight: 800; margin: 12px 0 4px; }
  .toggle {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 16px 0; font-size: 0.9rem; color: var(--muted);
  }
  .toggle input { width: 18px; height: 18px; }
  .hint { font-size: 0.8rem; color: #6b7385; margin-top: 18px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>日语高频词</h1>
  <p class="sub">四选一 · 离线可用 · 103 词</p>

  <div id="screen-start" class="screen active">
    <div class="start-card">
      <p>看汉字 / 假名，选正确中文意思。<br/>点错会显示正确答案和例句。</p>
      <div class="toggle">

      <div class="actions" style="flex-direction:column">
        <button class="btn btn-primary" id="btnStart10">练 10 题</button>
        <button class="btn btn-ghost" id="btnStart20">练 20 题</button>
        <button class="btn btn-ghost" id="btnStartAll">全部打乱</button>
      </div>
      <p class="hint">把本页加到主屏幕，或保存到「文件」，没网也能刷。</p>
    </div>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="bar">
      <span>第 <strong id="qNum">1</strong> / <span id="qTotal">10</span> 题</span>
      <span>得分 <strong id="score">0</strong></span>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="card">
      <div class="kanji" id="kanji">—</div>
      <div class="kana" id="kana"></div>
      <div class="romaji" id="romaji" hidden></div>
      <div class="example" id="example"></div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnHome" type="button">结束</button>
      <button class="btn btn-primary" id="btnNext" type="button" disabled>下一题</button>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="result-card">
      <p>本轮结束</p>
      <div class="score-big" id="finalScore">0/10</div>
      <p id="finalMsg"></p>
      <div class="actions" style="flex-direction:column;margin-top:20px">
        <button class="btn btn-primary" id="btnAgain">再来一轮</button>
        <button class="btn btn-ghost" id="btnBack">回首页</button>
      </div>
    </div>
  </div>

kana": "あつい", "romaji": "atsui", "meaning_zh": "热的", "example_ja": "夏は暑いです。", "example_zh": "夏天很热。"}, {"kanji": "暖かい", "kana": "あたたかい", "romaji": "atatakai", "meaning_zh": "暖和的", "example_ja": "春は暖かいです。", "example_zh": "春天暖和。"}, {"kanji": "涼しい", "kana": "すずしい", "romaji": "suzushii", "meaning_zh": "凉爽的", "example_ja": "秋は涼しいです。", "example_zh": "秋天凉爽。"}, {"kanji": "猫", "kana": "ねこ", "romaji": "neko", "meaning_zh": "猫", "example_ja": "猫が好きです。", "example_zh": "喜欢猫。"}];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickChoices(correct, all) {
  const others = shuffle(all.filter(w => w.meaning_zh !== correct.meaning_zh)).slice(0, 3);
  return shuffle([correct, ...others]);
}

function displayHead(w) {
  if (w.kanji && w.kanji !== w.kana) return w.kanji;
  return w.kana || w.kanji;
}

const el = (id) => document.getElementById(id);
let state = { queue: [], index: 0, score: 0, answered: false, lastN: 10 };

function showScreen(name) {
  ["start", "quiz", "result"].forEach(n => {
    el("screen-" + n).classList.toggle("active", n === name);
  });
}

function startQuiz(n) {
  state.lastN = n;
  const pool = shuffle(WORDS);
  state.queue = n >= WORDS.length ? pool : pool.slice(0, n);
  state.index = 0;
  state.score = 0;
  el("qTotal").textContent = state.queue.length;
  el("score").textContent = "0";
  showScreen("quiz");
  renderQuestion();
}

function renderQuestion() {
  const w = state.queue[state.index];
  state.answered = false;
  el("qNum").textContent = String(state.index + 1);
  el("prog").style.width = ((state.index) / state.queue.length * 100) + "%";
  el("kanji").textContent = displayHead(w);
  el("kana").textContent = (w.kanji && w.kanji !== w.kana) ? w.kana : "";
  const showR = el("showRomaji").checked;
  el("romaji").hidden = !showR;
  el("romaji").textContent = showR ? (w.romaji || "") : "";
  el("example").classList.remove("show");
  el("example").textContent = "";
  el("feedback").textContent = "";
  el("feedback").className = "feedback";
  el("btnNext").disabled = true;
  el("btnNext").textContent = state.index + 1 >= state.queue.length ? "看成绩" : "下一题";

  const choices = pickChoices(w, WORDS);
  const box = el("choices");
  box.innerHTML = "";
  choices.forEach((c) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.textContent = c.meaning_zh;
    b.addEventListener("click", () => onChoose(b, c, w));
    box.appendChild(b);
  });
}

function onChoose(btn, chosen, correct) {
  if (state.answered) return;
  state.answered = true;
  const ok = chosen.meaning_zh === correct.meaning_zh;
  if (ok) {
    state.score += 1;
    el("score").textContent = String(state.score);
    el("feedback").textContent = "正确 ✓";
    el("feedback").className = "feedback ok";
    btn.classList.add("correct");
  } else {
    el("feedback").textContent = "不对 · 答案是「" + correct.meaning_zh + "」";
    el("feedback").className = "feedback bad";
    btn.classList.add("wrong");
    [...el("choices").children].forEach(ch => {
      if (ch.textContent === correct.meaning_zh) ch.classList.add("correct");
    });
  }
  [...el("choices").children].forEach(ch => { ch.disabled = true; });
  if (correct.example_ja) {
    el("example").textContent = correct.example_ja + (correct.example_zh ? "　" + correct.example_zh : "");
    el("example").classList.add("show");
  }
  el("btnNext").disabled = false;
  el("prog").style.width = ((state.index + 1) / state.queue.length * 100) + "%";
}

function nextOrFinish() {
  if (!state.answered) return;
  if (state.index + 1 >= state.queue.length) {
    finish();
  } else {
    state.index += 1;
    renderQuestion();
  }
}

function finish() {
  const total = state.queue.length;
  const s = state.score;
  el("finalScore").textContent = s + "/" + total;
  const pct = total ? Math.round(s / total * 100) : 0;
  let msg = "继续加油。";
  if (pct >= 90) msg = "很稳，可以加到 20 题。";
  else if (pct >= 70) msg = "不错，错的词再过一遍。";
  else if (pct >= 50) msg = "先练 10 题打底就好。";
  else msg = "没事，多刷几轮就熟。";
  el("finalMsg").textContent = "正确率 " + pct + "% · " + msg;
  showScreen("result");
}

el("btnStart10").addEventListener("click", () => startQuiz(10));
el("btnStart20").addEventListener("click", () => startQuiz(20));
el("btnStartAll").addEventListener("click", () => startQuiz(WORDS.length));
el("btnNext").addEventListener("click", nextOrFinish);
el("btnHome").addEventListener("click", () => showScreen("start"));
el("btnAgain").addEventListener("click", () => startQuiz(state.lastN));
el("btnBack").addEventListener("click", () => showScreen("start"));
</script>
